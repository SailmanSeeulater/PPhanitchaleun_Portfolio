# What nginx needs so that latesailor.dev/api/ reaches the Lately server. Two pieces, in two places.
# deploy/README.md has the steps.

# 1. In the http block. A file of its own works: /etc/nginx/conf.d/portfolio-api.conf
#    At most six sign-in tries a minute from one address.
limit_req_zone $binary_remote_addr zone=portfolio_login:1m rate=6r/m;

# 2. Inside the server block for latesailor.dev (the one that listens on 443), above its "location /".
location = /api/login {
    limit_req zone=portfolio_login burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A post is at most 100 KB of text.
    client_max_body_size 256k;
    proxy_read_timeout 20s;
}
