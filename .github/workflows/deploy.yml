name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: 146.235.217.254
      VPS_USER: ubuntu
      WEB_ROOT: /var/www/portfolio
      # Public host key of the VPS (not a secret); pinned so the deploy refuses an impostor server.
      VPS_HOST_KEY: 146.235.217.254 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGjq3q6ZUmOdu85PlO0JdljadM+66ga2RSWuQng8129Z

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts

      - name: Sync build to the web root
        run: |
          rsync -rlz --delete --checksum \
            --chmod=D755,F644 --chown=www-data:www-data \
            --rsync-path="sudo rsync" \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ "$VPS_USER@$VPS_HOST:$WEB_ROOT/"

      - name: Smoke test
        run: |
          curl -fsS https://latesailor.dev/ | grep -q "Phanitchaleun"
          curl -fsSI https://latesailor.dev/music/battlement.mp3 | grep -qi "content-type: audio/mpeg"
