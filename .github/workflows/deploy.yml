name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: 146.235.217.254
      VPS_USER: ubuntu
      WEB_ROOT: /var/www/portfolio
      # Public host key of the VPS (not a secret); pinned so the deploy refuses an impostor server.
      VPS_HOST_KEY: 146.235.217.254 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGjq3q6ZUmOdu85PlO0JdljadM+66ga2RSWuQng8129Z

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the build counts AI co-authored commits and nexTix PRs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # The server behind Lately (server/): tested, then built as one program for the VPS (64-bit Intel Linux).
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test and build the API
        working-directory: server
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../api-build/portfolio-api .

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # The secret may be the key file as one base64 line (preferred: nothing for a browser to mangle)
          # or the raw PEM, which can arrive with CRLF endings, flattened lines, or stray spaces.
          KEY=$(printf '%s' "$VPS_SSH_KEY" | tr -d '\r')
          if printf '%s' "$KEY" | grep -q -- '-----BEGIN'; then
            HEADER=$(printf '%s' "$KEY" | grep -o -- '-----BEGIN [A-Z ]*-----' | head -1)
            FOOTER=$(printf '%s' "$KEY" | grep -o -- '-----END [A-Z ]*-----' | head -1)
            BODY=${KEY#*"$HEADER"}
            BODY=${BODY%"$FOOTER"*}
            { echo "$HEADER"; printf '%s' "$BODY" | tr -d ' \t\n' | fold -w 64; echo; echo "$FOOTER"; } | sed '/^$/d' > ~/.ssh/deploy_key
            FORMAT=pem
          else
            printf '%s' "$KEY" | tr -d ' \t\n' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || true
            FORMAT=base64
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::VPS_SSH_KEY is not a valid private key (read as $FORMAT)."
            # Shape only, never key material.
            echo "secret: ${#KEY} chars, $(printf '%s\n' "$KEY" | wc -l) lines"
            echo "BEGIN line: $(printf '%s' "$KEY" | grep -o -- '-----BEGIN [A-Z ]*-----' | head -1)"
            echo "END line:   $(printf '%s' "$KEY" | grep -o -- '-----END [A-Z ]*-----' | head -1)"
            echo "decoded file: $(wc -c < ~/.ssh/deploy_key) bytes, first line: $(head -1 ~/.ssh/deploy_key | grep -o -- '-----BEGIN [A-Z ]*-----' || echo 'no PEM header')"
            exit 1
          fi
          echo "Using key: $(ssh-keygen -lf ~/.ssh/deploy_key)"
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts

      - name: Sync build to the web root
        run: |
          rsync -rlz --delete --checksum \
            --chmod=D755,F644 --chown=www-data:www-data \
            --rsync-path="sudo rsync" \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ "$VPS_USER@$VPS_HOST:$WEB_ROOT/"

      # Only once the service has been set up on the server by hand (deploy/README.md). Before that there is
      # nothing to restart, so the upload is skipped and the site deploys as it always has.
      - name: Upload the API and restart it
        id: api
        run: |
          REMOTE="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes $VPS_USER@$VPS_HOST"
          if ! $REMOTE 'systemctl cat portfolio-api.service > /dev/null 2>&1'; then
            echo "::notice::portfolio-api isn't set up on the server yet (deploy/README.md), so the API wasn't uploaded."
            echo "installed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rsync -z --checksum \
            --chmod=F755 --chown=root:root \
            --rsync-path="sudo rsync" \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            api-build/portfolio-api "$VPS_USER@$VPS_HOST:/opt/portfolio-api/portfolio-api"
          $REMOTE 'sudo systemctl restart portfolio-api && sleep 2 && systemctl is-active --quiet portfolio-api'
          echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          curl -fsS https://latesailor.dev/ | grep -q "Phanitchaleun"
          curl -fsSI https://latesailor.dev/music/battlement.mp3 | grep -qi "content-type: audio/mpeg"

      - name: Smoke test the API
        if: steps.api.outputs.installed == 'true'
        run: curl -fsS https://latesailor.dev/api/posts | grep -q '"posts"'
